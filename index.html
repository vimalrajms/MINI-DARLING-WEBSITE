<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff72b6">
  <title>DARLING ♡</title>
  <style>
    :root {
      --pink: #ff72b6;
      --pink-light: #ffd5e9;
      --purple: #8b5cf6;
      --ink: #3d2340;
      --glass: rgba(255,255,255,.78);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 20px;
      display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, #fff 0, transparent 28%),
        radial-gradient(circle at 85% 80%, #e8d9ff 0, transparent 32%),
        linear-gradient(135deg, #ffe2f0, #f7e9ff 55%, #ffe8ef);
    }
    .app {
      width: min(100%, 480px); overflow: hidden; position: relative;
      border: 1px solid rgba(255,255,255,.9); border-radius: 30px;
      background: var(--glass); backdrop-filter: blur(16px);
      box-shadow: 0 22px 70px rgba(177, 70, 139, .2);
    }
    header {
      padding: 23px 22px 18px; text-align: center;
      background: linear-gradient(120deg, #ff9dce, #d9b6ff);
      color: #fff;
    }
    .brand { margin: 0; font-size: 2rem; letter-spacing: .18em; font-weight: 900; }
    .tagline { margin: 5px 0 0; font-size: .9rem; opacity: .95; }
    .content { padding: 22px; }
    .avatar-wrap { display: grid; place-items: center; margin: 2px 0 12px; }
    .avatar {
      width: 148px; height: 148px; display: grid; place-items: center;
      border-radius: 50%; border: 5px solid #fff;
      background: linear-gradient(145deg, #ffe2f0, #e8d9ff);
      box-shadow: 0 10px 25px rgba(208, 104, 172, .2);
      font-size: 5.2rem; animation: float 3s ease-in-out infinite;
      position: relative;
    }
    .avatar::after { content: "♡"; position: absolute; right: 3px; top: 5px; color: #ff5da8; font-size: 2rem; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
    .hello { text-align: center; margin: 8px 0 4px; font-size: 1.25rem; font-weight: 800; }
    .hint { text-align: center; margin: 0 0 19px; color: #8b6a8b; font-size: .9rem; }
    .status {
      display: flex; justify-content: center; align-items: center; gap: 8px;
      font-size: .83rem; color: #775d7c; margin: 0 auto 18px;
    }
    .dot { width: 9px; height: 9px; background: #ffad4d; border-radius: 50%; box-shadow: 0 0 0 4px #ffedd8; }
    form { display: flex; gap: 9px; }
    input {
      min-width: 0; flex: 1; border: 2px solid #f3d3e5; outline: none;
      border-radius: 16px; padding: 14px 15px; font: inherit; color: var(--ink);
      background: rgba(255,255,255,.9);
    }
    input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px #ffe4f1; }
    button {
      border: 0; border-radius: 16px; padding: 0 18px; cursor: pointer;
      font: inherit; font-weight: 800; color: white;
      background: linear-gradient(135deg, #ff72b6, #a879f7);
      box-shadow: 0 7px 15px rgba(202, 105, 185, .22);
      transition: transform .15s ease;
    }
    button:active { transform: scale(.96); }
    button:disabled { opacity: .6; cursor: wait; }
    .note {
      margin: 15px 0 0; padding: 12px 14px; border-radius: 14px;
      background: #fff0f7; color: #8b6280; font-size: .82rem; line-height: 1.45;
      text-align: center;
    }
    footer { text-align: center; color: #a180a0; font-size: .76rem; padding: 0 20px 20px; }
    @media (max-width: 380px) {
      body { padding: 10px; }
      .content { padding: 18px; }
      .avatar { width: 128px; height: 128px; font-size: 4.5rem; }
      button { padding: 0 13px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1 class="brand">DARLING ♡</h1>
      <p class="tagline">Your tiny offline companion</p>
    </header>
    <section class="content">
      <div class="avatar-wrap">
        <div class="avatar" role="img" aria-label="Cute anime girl">👧🏻</div>
      </div>
      <div class="hello">Hi! I'm Darling ✨</div>
      <p class="hint">Send a message to your mini robot</p>
      <div class="status" aria-live="polite">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Waiting for ESP32 connection</span>
      </div>
      <form id="messageForm">
        <input id="messageInput" name="message" maxlength="180" autocomplete="off"
          placeholder="Type a message..." aria-label="Message" required>
        <button id="sendButton" type="submit">Send ♡</button>
      </form>
      <div class="note">
        Your message is sent to the ESP32. Darling's reply is shown on the OLED display — not on this website.
      </div>
    </section>
    <footer>Made with ♡ · MINI DARLING</footer>
  </main>
  <script>
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");

    function setStatus(text, connected) {
      statusText.textContent = text;
      statusDot.style.background = connected ? "#42c98b" : "#ffad4d";
      statusDot.style.boxShadow = connected
        ? "0 0 0 4px #d9f8e9"
        : "0 0 0 4px #ffedd8";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      sendButton.disabled = true;
      sendButton.textContent = "Sending…";
      setStatus("Sending message to ESP32…", false);

      try {
        // The ESP32 firmware must provide POST /message and accept JSON: {"message":"..."}.
        // The response body is intentionally not displayed; the robot's reply belongs on the OLED.
        const response = await fetch("/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error("ESP32 request failed");
        setStatus("Message sent to Darling ♡", true);
        input.value = "";
        input.focus();
      } catch (error) {
        setStatus("Couldn't connect — connect to Darling's ESP32 Wi-Fi", false);
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send ♡";
      }
    });
  </script>
</body>
</html>
